<main class="test-page">

    <!----Category section---->
    <section id="category-screen" class="screen">

        <div class="test-heading">
            <h1>Practice Bank</h1>
            <p>Pick a category to start a quiz.</p>
        </div>
        <div id="category-grid" class="category-grid">
            <!-- filled in js -->
        </div>

    </section>
    <!-- Difficulty section -->
    <section id="difficulty-screen" class="screen hidden">
        <div class="setup-card">
            <button id="back-btn" class="link-btn">
                Back
            </button>
            <h2 id="category-name">
                Category
            </h2>
            <h3>Select Difficulty</h3>
            <div class="difficulty-buttons">
                <button class="Take difficulty-btn" data-difficulty="easy">
                    Easy
                </button>
                <button class="Take difficulty-btn" data-difficulty="medium">
                    Medium
                </button>
                <button class="Take difficulty-btn" data-difficulty="hard">
                    Hard
                </button>
            </div>
        </div>
    </section>

    <!-- Quiz section -->
    <section id="quiz-screen" class="screen hidden">
        <div class="quiz-card">
            <div class="quiz-top">
                <span id="quiz-progress">
                    Question 1 / 10
                </span>
            </div>
            <div class="progress-bar-track">
                <div id="progress-bar-fill"
                        class="progress-bar-fill">
                </div>
            </div>
            <span id="quiz-difficulty-tag"
                    class="tag">
            </span>
            <h2 id="question-text">
            </h2>
            <div id="options-list"
                    class="options-list">
            </div>
            <button id="next-btn"
                    class="Take hidden">
                Next Question
            </button>
        </div>
    </section>
</main>


<script src="js/quiz.js"></script>
<script src="js/main.js"></script>

</body>
</html>
